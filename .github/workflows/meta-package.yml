name: meta-package

on:
  push:
    paths:
      - "VERSION"
      - "packages/meta/**"
      - "packages/*/pyproject.toml"
      - "scripts/release_version.py"
      - "scripts/validate_packaging_contract.py"
      - "package-boundaries.toml"
      - "pyproject.toml"
      - ".github/workflows/meta-package.yml"
  pull_request:
    paths:
      - "VERSION"
      - "packages/meta/**"
      - "packages/*/pyproject.toml"
      - "scripts/release_version.py"
      - "scripts/validate_packaging_contract.py"
      - "package-boundaries.toml"
      - "pyproject.toml"
      - ".github/workflows/meta-package.yml"

jobs:
  validate-meta:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Check coordinated release version
        run: python scripts/release_version.py check
      - name: Validate clean umbrella packaging contract
        run: python scripts/validate_packaging_contract.py --skip-upgrade
