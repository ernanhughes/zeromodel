name: apply-p17-hardening

on:
  push:
    branches:
      - agent/p17-hardening
    paths:
      - .github/workflows/p17-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p17-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed hardening patch
        shell: bash
        run: |
          cat > /tmp/p17-hardening.patch.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/p17-hardening.patch.b64 > /tmp/p17-hardening.patch
          git apply --check /tmp/p17-hardening.patch
          git apply /tmp/p17-hardening.patch
      - name: Verify perception suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "numpy<2.0"
          PYTHONPATH=packages/core/src:packages/observation/src:packages/perception/src \
            python -m pytest -q packages/perception/tests
      - name: Commit hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/perception
          git commit -m "fix(perception): complete P17 integration hardening"
          git push origin HEAD:agent/p17-hardening
