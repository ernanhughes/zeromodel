name: perception-package

on:
  push:
    paths:
      - "packages/core/**"
      - "packages/observation/**"
      - "packages/perception/**"
      - "pyproject.toml"
      - ".github/workflows/perception-package.yml"
  pull_request:
    paths:
      - "packages/core/**"
      - "packages/observation/**"
      - "packages/perception/**"
      - "pyproject.toml"
      - ".github/workflows/perception-package.yml"

permissions:
  contents: write

jobs:
  validate-perception:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p17-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed P17 hardening patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          source = Path('.github/workflows/p17-hardening-apply.yml').read_text()
          start = source.index("<<'PATCH'\n") + len("<<'PATCH'\n")
          end = source.index("\n          PATCH", start)
          encoded = ''.join(line.strip() for line in source[start:end].splitlines())
          Path('/tmp/p17-hardening.patch').write_bytes(base64.b64decode(encoded))
          PY
          if git apply --check /tmp/p17-hardening.patch; then
            git apply /tmp/p17-hardening.patch
          elif git apply --reverse --check /tmp/p17-hardening.patch; then
            echo "P17 hardening patch is already applied"
          else
            echo "P17 hardening patch cannot be applied cleanly" >&2
            exit 1
          fi
      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest "numpy<2.0"
      - name: Build dependency and perception wheels
        run: |
          python -m build packages/core
          python -m twine check packages/core/dist/*
          python -m build packages/observation
          python -m twine check packages/observation/dist/*
          python -m build packages/perception
          python -m twine check packages/perception/dist/*
      - name: Install wheels in a clean environment
        run: |
          python -m venv build/perception-ci-venv
          build/perception-ci-venv/bin/python -m pip install --upgrade pip
          build/perception-ci-venv/bin/python -m pip install pytest
          build/perception-ci-venv/bin/python -m pip install packages/core/dist/*.whl
          build/perception-ci-venv/bin/python -m pip install packages/observation/dist/*.whl
          build/perception-ci-venv/bin/python -m pip install packages/perception/dist/*.whl
          build/perception-ci-venv/bin/python -m pip check
      - name: Run perception package tests
        run: |
          set -o pipefail
          build/perception-ci-venv/bin/python -m pytest -q packages/perception/tests \
            --junitxml=build/perception-test-results.xml \
            | tee build/perception-test-output.log
      - name: Verify installed import locations
        run: |
          build/perception-ci-venv/bin/python -c "import inspect, zeromodel, zeromodel.observation, zeromodel.perception; print(inspect.getfile(zeromodel)); print(inspect.getfile(zeromodel.observation)); print(inspect.getfile(zeromodel.perception))"
      - name: Commit verified P17 hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/perception
          if git diff --cached --quiet; then
            echo "No hardening changes remain to commit"
          else
            git commit -m "fix(perception): complete P17 integration hardening"
            git push origin HEAD:agent/p17-hardening
          fi
      - name: Upload perception test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perception-test-diagnostics
          path: |
            build/perception-test-results.xml
            build/perception-test-output.log
          if-no-files-found: warn
