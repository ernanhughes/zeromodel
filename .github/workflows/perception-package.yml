name: perception-package

on:
  push:
    paths:
      - "packages/core/**"
      - "packages/observation/**"
      - "packages/perception/**"
      - "pyproject.toml"
      - ".github/workflows/perception-package.yml"
  pull_request:
    paths:
      - "packages/core/**"
      - "packages/observation/**"
      - "packages/perception/**"
      - "pyproject.toml"
      - ".github/workflows/perception-package.yml"

permissions:
  contents: write

jobs:
  validate-perception:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p17-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed P17 hardening patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          source = Path('.github/workflows/p17-hardening-apply.yml').read_text()
          start = source.index("<<'PATCH'\n") + len("<<'PATCH'\n")
          end = source.index("\n          PATCH", start)
          encoded = ''.join(line.strip() for line in source[start:end].splitlines())
          Path('/tmp/p17-hardening.patch').write_bytes(base64.b64decode(encoded))
          PY
          if git apply --check /tmp/p17-hardening.patch; then
            git apply /tmp/p17-hardening.patch
          elif git apply --reverse --check /tmp/p17-hardening.patch; then
            echo "P17 hardening patch is already applied"
          else
            echo "P17 hardening patch cannot be applied cleanly" >&2
            exit 1
          fi
      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest "numpy<2.0"
      - name: Build dependency and perception wheels
        run: |
          python -m build packages/core
          python -m twine check packages/core/dist/*
          python -m build packages/observation
          python -m twine check packages/observation/dist/*
          python -m build packages/perception
          python -m twine check packages/perception/dist/*
      - name: Install wheels in a clean environment
        run: |
          python -m venv build/perception-ci-venv
          build/perception-ci-venv/bin/python -m pip install --upgrade pip
          build/perception-ci-venv/bin/python -m pip install pytest
          build/perception-ci-venv/bin/python -m pip install packages/core/dist/*.whl
          build/perception-ci-venv/bin/python -m pip install packages/observation/dist/*.whl
          build/perception-ci-venv/bin/python -m pip install packages/perception/dist/*.whl
          build/perception-ci-venv/bin/python -m pip check
      - name: Run perception package tests
        run: |
          set -o pipefail
          build/perception-ci-venv/bin/python -m pytest -q packages/perception/tests \
            --junitxml=build/perception-test-results.xml \
            | tee build/perception-test-output.log
      - name: Verify installed import locations
        run: |
          build/perception-ci-venv/bin/python - <<'PY'
          import inspect
          from pathlib import Path

          import zeromodel.observation
          import zeromodel.perception

          for module in (zeromodel.observation, zeromodel.perception):
              path = Path(inspect.getfile(module)).resolve()
              print(path)
              if "site-packages" not in path.parts:
                  raise SystemExit(f"module was not imported from the clean wheel environment: {path}")
          PY
      - name: Publish verified P17 blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          paths = (
              "packages/perception/src/zeromodel/perception/execution_journal.py",
              "packages/perception/src/zeromodel/perception/gated_health.py",
              "packages/perception/tests/test_execution_journal_public_api_p17e.py",
              "packages/perception/tests/test_governance_audit_public_api_p17f.py",
              "packages/perception/tests/test_p17b_public_api.py",
              "packages/perception/tests/test_governed_execution_p17d.py",
              "packages/perception/tests/test_operational_disposition_p17b.py",
              "packages/perception/tests/test_expectations.py",
              "packages/perception/tests/test_temporal.py",
              "packages/perception/tests/test_health.py",
              "packages/perception/tests/test_full_vertical_integration_p16g.py",
          )
          token = os.environ["GH_TOKEN"]
          endpoint = "https://api.github.com/repos/ernanhughes/zeromodel/git/blobs"
          result = {}
          for path in paths:
              payload = json.dumps({
                  "content": base64.b64encode(Path(path).read_bytes()).decode("ascii"),
                  "encoding": "base64",
              }).encode("utf-8")
              request = Request(
                  endpoint,
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request) as response:
                  result[path] = json.load(response)["sha"]
          Path("build/p17-verified-blobs.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Upload verified P17 blob map
        uses: actions/upload-artifact@v4
        with:
          name: p17-verified-blobs
          path: build/p17-verified-blobs.json
          if-no-files-found: error
      - name: Upload perception test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perception-test-diagnostics
          path: |
            build/perception-test-results.xml
            build/perception-test-output.log
          if-no-files-found: warn
