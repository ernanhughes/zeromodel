name: TestPyPI coordinated build check (publishing disabled)

# This workflow is a manually triggered dry run. It builds and checks every
# coordinated distribution but deliberately performs no upload. VERSION is the
# release-number authority; package metadata is verified before any build.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    name: build and check coordinated distributions (no publish)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Check coordinated release version
        run: python scripts/release_version.py check

      - name: Build source and wheel distributions for all packages
        run: |
          set -e
          for pkg in core analysis observation vision perception observer video sqlalchemy artifacts trust navigation; do
            python -m build "packages/$pkg"
          done

      - name: Check distribution metadata
        run: |
          set -e
          for pkg in core analysis observation vision perception observer video sqlalchemy artifacts trust navigation; do
            python -m twine check "packages/$pkg/dist/"*
          done
