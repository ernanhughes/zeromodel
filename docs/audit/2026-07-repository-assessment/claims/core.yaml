- id: F03
  title: Bundle format is lossless but minimal
  classification: boundary clarification
  evidence_state: confirmed by source inspection
  claim_affected: [C6]
  repository_sha: 2b12b58096676baa8dfb5d59b512e07b161612d4
  source_paths: [packages/core/src/zeromodel/core/bundle.py, packages/core/tests/test_views_bundle_render.py]
  symbols: [to_bundle, from_bundle, bundle_manifest]
  commands: [focused core pytest, adversarial probe]
  observed_result: .vpm is a zip containing manifest.json with full artifact JSON; unsupported version and tampered artifact content are rejected via version check or artifact ID mismatch.
  interpretation: Persistence preserves identity, but there is no multi-file manifest closure, signature, or rich bundle schema in this slice.
  why_it_matters: Claims should say lossless bundle, not authenticated or self-describing visual container.
  does_it_invalidate_the_bounded_claim: false
  smallest_corrective_action: document minimal bundle scope
  test_that_would_prove_correction: tests for missing manifest, malformed zip, extra files, and duplicate zip members
  claims_audit_change_required: minor wording only if stronger wording appears
  confidence: high
