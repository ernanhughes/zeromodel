schema_version = 1
release_version = "1.3.0"
forbidden_roots = ["zeromodel"]
research_root = "research"
examples_root = "examples"
integration_tests_root = "tests/integration"

[packages.core]
kind = "runtime"
distribution = "zeromodel-core"
namespace = "zeromodel.core"
source_root = "packages/core/src"
depends_on = []
publishable = true
owned_prefixes = ["zeromodel.core"]

[packages.analysis]
kind = "runtime"
distribution = "zeromodel-analysis"
namespace = "zeromodel.analysis"
source_root = "packages/analysis/src"
depends_on = ["core"]
publishable = true
owned_prefixes = ["zeromodel.analysis"]

[packages.observation]
kind = "runtime"
distribution = "zeromodel-observation"
namespace = "zeromodel.observation"
source_root = "packages/observation/src"
depends_on = ["core"]
publishable = true
owned_prefixes = ["zeromodel.observation"]

[packages.vision]
kind = "runtime"
distribution = "zeromodel-vision"
namespace = "zeromodel.vision"
source_root = "packages/vision/src"
depends_on = ["core", "observation"]
publishable = true
owned_prefixes = ["zeromodel.vision"]

[packages.perception]
kind = "runtime"
distribution = "zeromodel-perception"
namespace = "zeromodel.perception"
source_root = "packages/perception/src"
depends_on = ["core", "observation"]
publishable = true
owned_prefixes = ["zeromodel.perception"]

[packages.observer]
kind = "runtime"
distribution = "zeromodel-observer"
namespace = "zeromodel.observer"
source_root = "packages/observer/src"
depends_on = ["core", "observation", "perception"]
publishable = true
owned_prefixes = ["zeromodel.observer"]

[packages.video]
kind = "runtime"
distribution = "zeromodel-video"
namespace = "zeromodel.video"
source_root = "packages/video/src"
depends_on = ["core", "observation"]
publishable = true
owned_prefixes = ["zeromodel.video"]

[packages.sqlalchemy]
kind = "runtime"
distribution = "zeromodel-sqlalchemy"
namespace = "zeromodel.persistence.sqlalchemy"
source_root = "packages/sqlalchemy/src"
depends_on = ["core", "video"]
publishable = true
owned_prefixes = ["zeromodel.persistence.sqlalchemy"]

[packages.artifacts]
kind = "runtime"
distribution = "zeromodel-artifacts"
namespace = "zeromodel.artifacts"
source_root = "packages/artifacts/src"
depends_on = ["core"]
publishable = true
owned_prefixes = ["zeromodel.artifacts"]

[packages.trust]
kind = "runtime"
distribution = "zeromodel-trust"
namespace = "zeromodel.trust"
source_root = "packages/trust/src"
depends_on = ["core", "artifacts"]
publishable = true
owned_prefixes = ["zeromodel.trust"]

[packages.navigation]
kind = "runtime"
distribution = "zeromodel-navigation"
namespace = "zeromodel.navigation"
source_root = "packages/navigation/src"
depends_on = ["core", "artifacts"]
publishable = true
owned_prefixes = ["zeromodel.navigation"]

[packages.search]
kind = "runtime"
distribution = "zeromodel-search"
namespace = "zeromodel.search"
source_root = "packages/search/src"
depends_on = ["core", "artifacts", "navigation"]
publishable = true
owned_prefixes = ["zeromodel.search"]

[packages.critic]
kind = "runtime"
distribution = "zeromodel-critic"
namespace = "zeromodel.critic"
source_root = "packages/critic/src"
depends_on = ["core", "artifacts"]
publishable = true
owned_prefixes = ["zeromodel.critic"]

[packages.meta]
kind = "meta"
distribution = "zeromodel"
namespace = ""
source_root = "packages/meta"
depends_on = [
    "core",
    "analysis",
    "observation",
    "vision",
    "perception",
    "observer",
    "video",
    "sqlalchemy",
    "artifacts",
    "trust",
    "navigation",
    "search",
    "critic",
]
publishable = true
owned_prefixes = []
