[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeromodel-core"
version = "1.3.0"
description = "ZeroModel core package"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ernan Hughes", email = "ernanhughes@gmail.com"}]
keywords = ["visual-policy-map", "vpm", "policy-lookup", "deterministic-artifacts"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.23",
]

[project.urls]
Homepage = "https://zeromodel.org/"
Repository = "https://github.com/ernanhughes/zeromodel"
Documentation = "https://zeromodel.org/"

[tool.setuptools]
packages = []

[tool.setuptools.data-files]
"." = ["src/zeromodel_core_payload.pth"]
"zeromodel_core_payload/zeromodel/core" = [
    "src/zeromodel/core/__init__.py",
    "src/zeromodel/core/artifact.py",
    "src/zeromodel/core/bundle.py",
    "src/zeromodel/core/content_identity.py",
    "src/zeromodel/core/decision_adjudication.py",
    "src/zeromodel/core/lua.py",
    "src/zeromodel/core/matrix_blob.py",
    "src/zeromodel/core/metrics.py",
    "src/zeromodel/core/policy_lookup.py",
    "src/zeromodel/core/policy_transitions.py",
    "src/zeromodel/core/render.py",
    "src/zeromodel/core/views.py",
]
