[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeromodel"
version = "1.3.0"
description = "ZeroModel complete coordinated runtime umbrella"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ernan Hughes", email = "ernanhughes@gmail.com"}]
keywords = ["visual-policy-map", "vpm", "zeromodel", "umbrella-package"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "zeromodel-core==1.3.0",
    "zeromodel-analysis==1.3.0",
    "zeromodel-observation==1.3.0",
    "zeromodel-vision==1.3.0",
    "zeromodel-perception==1.3.0",
    "zeromodel-observer==1.3.0",
    "zeromodel-video==1.3.0",
    "zeromodel-sqlalchemy==1.3.0",
    "zeromodel-artifacts==1.3.0",
    "zeromodel-trust==1.3.0",
    "zeromodel-navigation==1.3.0",
    "zeromodel-search==1.3.0",
    "zeromodel-critic==1.3.0",
]

[project.urls]
Homepage = "https://zeromodel.org/"
Repository = "https://github.com/ernanhughes/zeromodel"
Documentation = "https://zeromodel.org/"

[tool.setuptools]
packages = []
